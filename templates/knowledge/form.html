{% extends "base.html" %}

{% block title %}{{ title }} · FaultTrace{% endblock %}

{% block content %}
<a href="{% url 'incident_detail' incident.pk %}" class="text-decoration-none">← Ocorrência #{{ incident.pk }}</a>
<div class="card mt-3">
    <div class="card-body">
        <h1 class="h3">{{ title }}</h1>
        <p class="text-body-secondary">{{ incident.equipment }}</p>
        {% if form_explanation %}<p class="text-body-secondary">{{ form_explanation }}</p>{% endif %}
        <form method="post" class="fault-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-primary" type="submit">{{ submit_label|default:"Salvar" }}</button>
        </form>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}{% if equipment %}Editar{% else %}Novo{% endif %} equipamento · FaultTrace{% endblock %}

{% block content %}
<div class="row justify-content-center"><div class="col-lg-8">
    <h1 class="h2 mb-4">{% if equipment %}Editar equipamento{% else %}Novo equipamento{% endif %}</h1>
    <form method="post" class="card card-body fault-form">
        {% csrf_token %}{{ form.as_p }}
        <div><button class="btn btn-primary" type="submit">Salvar</button> <a class="btn btn-link" href="{% url 'equipment_list' %}">Cancelar</a></div>
    </form>
</div></div>
{% endblock %}

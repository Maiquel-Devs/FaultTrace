{% extends "base.html" %}

{% block title %}Nova ocorrência · FaultTrace{% endblock %}

{% block content %}
<div class="row justify-content-center"><div class="col-lg-8">
    <h1 class="h2 mb-4">Registrar ocorrência</h1>
    <form method="post" class="card card-body fault-form">
        {% csrf_token %}{{ form.as_p }}
        <div><button class="btn btn-primary" type="submit">Registrar</button> <a class="btn btn-link" href="{% url 'incident_list' %}">Cancelar</a></div>
    </form>
</div></div>
{% endblock %}
